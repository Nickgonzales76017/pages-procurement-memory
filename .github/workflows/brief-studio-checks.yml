name: Acquisition Brief Studio checks
on:
  push:
    branches: [main]
    paths:
      - 'site/brief-studio/**'
      - 'site/journey-kit/**'
      - 'site/itad-exchange/**'
      - 'site/estate-exit/**'
      - 'tests/operating-rooms.test.mjs'
      - 'tests/brief-studio.test.mjs'
      - '.github/workflows/brief-studio-checks.yml'
  pull_request:
    paths:
      - 'site/brief-studio/**'
      - 'site/journey-kit/**'
      - 'site/itad-exchange/**'
      - 'site/estate-exit/**'
      - 'tests/operating-rooms.test.mjs'
      - 'tests/brief-studio.test.mjs'
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check native-format browser modules
        run: |
          node --check site/brief-studio/core.mjs
          node --check site/brief-studio/studio.mjs
          node --check site/journey-kit/room.mjs
          node --check site/itad-exchange/core.mjs
          node --check site/itad-exchange/app.mjs
          node --check site/estate-exit/core.mjs
          node --check site/estate-exit/app.mjs
      - name: Run decision and verification contracts
        run: node --test tests/brief-studio.test.mjs tests/operating-rooms.test.mjs
